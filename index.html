<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>저격전: Sniper Duel PvP</title>
<style>
  :root{
    --bg:#0c0f0a; --panel:#12160f; --line:#3a4632; --accent:#c9a227; --accent2:#7fae3a;
    --danger:#c23b3b; --text:#e8e4d3; --text-dim:#9aa08c;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0c0f0a; --panel:#12160f; --line:#3a4632; --text:#e8e4d3; --text-dim:#9aa08c; }
  }
  :root[data-theme="dark"]{ --bg:#0c0f0a; --panel:#12160f; --line:#3a4632; --text:#e8e4d3; --text-dim:#9aa08c; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:'Segoe UI',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);}
  #canvasWrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
  .hud-panel{position:absolute;background:rgba(12,15,10,0.72);border:1px solid var(--line);
    padding:10px 14px;border-radius:4px;backdrop-filter:blur(2px);}
  #healthBox{left:16px;bottom:16px;width:220px;}
  #healthLabel,#oppHealthLabel{font-size:11px;letter-spacing:0.04em;color:var(--text-dim);margin-bottom:4px;}
  #healthBarOuter,#oppHealthBarOuter{width:100%;height:14px;background:#1c2116;border:1px solid var(--line);border-radius:2px;overflow:hidden;}
  #healthBarInner{height:100%;width:100%;background:linear-gradient(90deg,#7fae3a,#c9a227);transition:width 0.15s;}
  #oppHealthBarInner{height:100%;width:100%;background:linear-gradient(90deg,#c23b3b,#e0684f);transition:width 0.15s;}
  #healthNum,#oppHealthNum{font-size:13px;margin-top:4px;color:var(--text);}

  #ammoBox{right:16px;bottom:16px;text-align:right;min-width:150px;}
  #ammoLabel{font-size:11px;letter-spacing:0.04em;color:var(--text-dim);}
  #ammoNum{font-size:26px;font-weight:600;color:var(--accent);line-height:1.1;}
  #ammoReserve{font-size:13px;color:var(--text-dim);}
  #reloadMsg{font-size:12px;color:var(--danger);height:16px;margin-top:2px;}

  #scoreBox{top:16px;right:16px;text-align:right;}
  #waveBox{top:16px;left:16px;}
  #oppHealthBox{top:16px;left:50%;transform:translateX(-50%);width:220px;text-align:center;}
  .stat-row{font-size:13px;margin:2px 0;color:var(--text-dim);}
  .stat-row b{color:var(--text);font-weight:600;}

  #waitMsg{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
    font-size:16px;color:var(--accent);background:rgba(12,15,10,0.75);padding:10px 20px;
    border:1px solid var(--line);border-radius:4px;display:none;}

  #crosshair{position:absolute;top:50%;left:50%;width:20px;height:20px;transform:translate(-50%,-50%);}
  #crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(232,228,211,0.85);}
  #crosshair::before{left:9px;top:0;width:2px;height:20px;}
  #crosshair::after{top:9px;left:0;width:20px;height:2px;}
  #crosshair.hidden{display:none;}

  #hitmarker{position:absolute;top:50%;left:50%;width:26px;height:26px;transform:translate(-50%,-50%);opacity:0;pointer-events:none;}
  #hitmarker::before,#hitmarker::after{content:'';position:absolute;background:var(--danger);width:3px;height:26px;top:0;left:12px;}
  #hitmarker::before{transform:rotate(45deg);}
  #hitmarker::after{transform:rotate(-45deg);}
  #hitmarker.show{animation:hitflash 0.28s ease-out;}
  @keyframes hitflash{0%{opacity:1;}100%{opacity:0;}}

  #scope{position:fixed;inset:0;display:none;pointer-events:none;z-index:11;}
  #scope.active{display:block;}
  #scope .mask{position:absolute;inset:0;background:radial-gradient(circle at center, transparent 0, transparent 17vh, #050603 17.3vh);}
  #scope .ring{position:absolute;top:50%;left:50%;width:34vh;height:34vh;transform:translate(-50%,-50%);border:2px solid rgba(232,228,211,0.5);border-radius:50%;}
  #scope .cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
  #scope .cross::before,#scope .cross::after{content:'';position:absolute;background:rgba(232,228,211,0.65);}
  #scope .cross::before{left:-17vh;top:-0.5px;width:34vh;height:1px;}
  #scope .cross::after{top:-17vh;left:-0.5px;height:34vh;width:1px;}

  #headshotPop{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
    font-size:34px;font-weight:800;color:var(--danger);letter-spacing:0.04em;text-shadow:0 0 10px rgba(0,0,0,0.8);opacity:0;}
  #headshotPop.show{animation:pop 0.9s ease-out;}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-40%) scale(0.7);}
    15%{opacity:1;transform:translate(-50%,-50%) scale(1.08);}
    70%{opacity:1;}100%{opacity:0;transform:translate(-50%,-55%) scale(1);}}

  #damageVignette{position:fixed;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 0 0 rgba(194,59,59,0);transition:box-shadow 0.1s;}
  #damageVignette.show{box-shadow:inset 0 0 140px 40px rgba(194,59,59,0.55);}

  #pickupMsg{position:absolute;bottom:70px;left:50%;transform:translate(-50%,0);font-size:14px;color:var(--accent2);opacity:0;text-align:center;}
  #pickupMsg.show{animation:pickup 1.4s ease-out;}
  @keyframes pickup{0%{opacity:0;transform:translate(-50%,10px);}15%{opacity:1;transform:translate(-50%,0);}80%{opacity:1;}100%{opacity:0;}}

  #blocker{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center, rgba(20,24,16,0.92), rgba(6,7,4,0.97));overflow-y:auto;padding:20px;}
  #blocker.hidden{display:none;}
  .card{max-width:500px;width:100%;background:var(--panel);border:1px solid var(--line);
    padding:30px 28px;border-radius:6px;text-align:center;margin:auto;}
  .card h1{font-size:24px;margin:0 0 6px;letter-spacing:0.02em;color:var(--text);}
  .card .sub{color:var(--text-dim);font-size:13px;margin-bottom:18px;}
  .rules{text-align:left;font-size:12.5px;line-height:1.85;color:var(--text-dim);margin:0 0 20px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;}
  .rules b{color:var(--text);font-weight:600;}
  .btn{display:inline-block;background:var(--accent);color:#1a1502;border:none;padding:12px 26px;
    font-size:15px;font-weight:700;border-radius:4px;cursor:pointer;letter-spacing:0.02em;width:100%;margin-top:8px;}
  .btn:hover{background:#ddb432;}
  .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn.secondary:hover{border-color:var(--accent);color:var(--accent);}
  .btn.small{width:auto;padding:8px 16px;font-size:13px;margin-top:0;}
  .menuStack .btn{margin-bottom:10px;}
  .resultStat{font-size:15px;margin:6px 0;color:var(--text);}
  .resultStat b{color:var(--accent);}
  .codeArea{width:100%;height:90px;background:#080a06;color:var(--accent2);border:1px solid var(--line);
    border-radius:4px;padding:8px;font-size:11px;font-family:monospace;resize:none;margin-bottom:8px;word-break:break-all;}
  .inputRow{display:flex;gap:8px;margin-bottom:8px;}
  .inputRow textarea{flex:1;}
  .fieldLabel{text-align:left;font-size:12px;color:var(--text-dim);margin:10px 0 4px;}
  .statusMsg{font-size:13px;color:var(--accent2);margin-top:10px;min-height:16px;}
  .statusMsg.err{color:var(--danger);}
  .backLink{display:block;margin-top:14px;font-size:12px;color:var(--text-dim);cursor:pointer;text-decoration:underline;}

  /* ---------- Mobile touch controls ---------- */
  #mobileControls{display:none; position:fixed; inset:0; z-index:15;}
  body.mobile-mode #mobileControls{display:block;}
  body.mobile-mode #crosshair{display:none;}
  #lookZone{position:absolute; inset:0; z-index:1; touch-action:none;}
  #joystickBase{position:absolute; left:20px; bottom:max(20px, env(safe-area-inset-bottom,0px));
    width:120px; height:120px; border-radius:50%; background:rgba(232,228,211,0.10);
    border:2px solid rgba(232,228,211,0.3); z-index:5; touch-action:none;}
  #joystickKnob{position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px;
    border-radius:50%; background:rgba(201,162,39,0.55); border:2px solid rgba(232,228,211,0.6);}
  .mbtn{position:absolute; border-radius:50%; background:rgba(12,15,10,0.65); border:2px solid var(--line);
    color:var(--text); font-size:12px; font-weight:700; z-index:6; touch-action:none;
    -webkit-user-select:none; user-select:none; display:flex; align-items:center; justify-content:center;}
  #btnFire{right:20px; bottom:max(20px, env(safe-area-inset-bottom,0px)); width:76px; height:76px;
    background:rgba(194,59,59,0.35); border-color:var(--danger); font-size:14px;}
  #btnJump{right:106px; bottom:max(20px, env(safe-area-inset-bottom,0px)); width:58px; height:58px;}
  #btnAim{right:20px; bottom:110px; width:58px; height:58px;}
  #btnAim.on{background:rgba(201,162,39,0.5); border-color:var(--accent);}
  #btnReload{right:106px; bottom:110px; width:50px; height:50px; font-size:11px;}
  #btnPauseMobile{left:16px; top:max(16px, env(safe-area-inset-top,0px)); width:40px; height:40px; font-size:18px;}

  body.mobile-mode #healthBox{bottom:calc(env(safe-area-inset-bottom,0px) + 158px); width:160px;}
  body.mobile-mode #ammoBox{bottom:calc(env(safe-area-inset-bottom,0px) + 180px); min-width:110px;}
  body.mobile-mode .hud-panel{padding:7px 10px;}
  body.mobile-mode #scoreBox, body.mobile-mode #waveBox{font-size:11px;}
</style>
</head>
<body>

<div id="canvasWrap"></div>

<div id="hud">
  <div id="crosshair"></div>
  <div id="hitmarker"></div>
  <div id="headshotPop">헤드샷!</div>
  <div id="pickupMsg"></div>
  <div id="waitMsg">상대방을 기다리는 중...</div>

  <div class="hud-panel" id="healthBox">
    <div id="healthLabel">체력</div>
    <div id="healthBarOuter"><div id="healthBarInner"></div></div>
    <div id="healthNum">100</div>
  </div>

  <div class="hud-panel" id="oppHealthBox" style="display:none;">
    <div id="oppHealthLabel">상대 체력 (추정)</div>
    <div id="oppHealthBarOuter"><div id="oppHealthBarInner"></div></div>
    <div id="oppHealthNum">100</div>
  </div>

  <div class="hud-panel" id="ammoBox">
    <div id="ammoLabel">탄약</div>
    <div id="ammoNum">5</div>
    <div id="ammoReserve">예비: 40</div>
    <div id="reloadMsg"></div>
  </div>

  <div class="hud-panel" id="scoreBox">
    <div class="stat-row">점수: <b id="scoreNum">0</b></div>
    <div class="stat-row">처치: <b id="killNum">0</b></div>
  </div>

  <div class="hud-panel" id="waveBox">
    <div class="stat-row">웨이브 <b id="waveNum">1</b></div>
    <div class="stat-row">남은 적: <b id="enemyLeftNum">0</b></div>
  </div>
</div>

<div id="scope">
  <div class="mask"></div>
  <div class="ring"></div>
  <div class="cross"></div>
</div>

<div id="damageVignette"></div>

<div id="mobileControls">
  <div id="lookZone"></div>
  <div id="joystickBase"><div id="joystickKnob"></div></div>
  <button id="btnPauseMobile" class="mbtn">≡</button>
  <button id="btnJump" class="mbtn">점프</button>
  <button id="btnReload" class="mbtn">장전</button>
  <button id="btnAim" class="mbtn">조준</button>
  <button id="btnFire" class="mbtn">발사</button>
</div>

<div id="blocker"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

const isMobile = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
if(isMobile) document.body.classList.add('mobile-mode');

/* ============================================================
   Three.js base setup
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb8d8);
scene.fog = new THREE.Fog(0x8fb8d8, 35, 130);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 500);
const BASE_FOV = 75, SCOPE_FOV = 22;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.getElementById('canvasWrap').appendChild(renderer.domElement);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const hemi = new THREE.HemisphereLight(0xffffff, 0x445522, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d0, 0.9);
sun.position.set(30,50,10);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(240,240),
  new THREE.MeshLambertMaterial({color:0x6f8f4a})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

const grid = new THREE.GridHelper(240, 48, 0x4a6034, 0x557038);
grid.position.y = 0.01;
scene.add(grid);

/* ============================================================
   Buildings (structures / cover) - symmetric about z=0 so the
   PvP map is fair for both spawn ends
   ============================================================ */
const buildingDefs = [
  {x:-14, z: 9,  w:6, h:8, d:6, color:0x8a7f6b},
  {x: 14, z: 9,  w:6, h:8, d:6, color:0x8a7f6b},
  {x:-14, z:-9,  w:6, h:8, d:6, color:0x8a7f6b},
  {x: 14, z:-9,  w:6, h:8, d:6, color:0x8a7f6b},

  {x:-9,  z: 19, w:5, h:6, d:8, color:0x7c8a6b},
  {x: 9,  z: 19, w:5, h:6, d:8, color:0x7c8a6b},
  {x:-9,  z:-19, w:5, h:6, d:8, color:0x7c8a6b},
  {x: 9,  z:-19, w:5, h:6, d:8, color:0x7c8a6b},

  {x:-24, z: 14, w:5, h:5, d:5, color:0x8a7f6b},
  {x: 24, z: 14, w:5, h:5, d:5, color:0x8a7f6b},
  {x:-24, z:-14, w:5, h:5, d:5, color:0x8a7f6b},
  {x: 24, z:-14, w:5, h:5, d:5, color:0x8a7f6b},

  {x:0, z:0, w:3, h:4, d:3, color:0x9a9382}
];

const buildingMeshes = [];
const buildingAABB = [];
buildingDefs.forEach(b=>{
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(b.w,b.h,b.d), new THREE.MeshLambertMaterial({color:b.color}));
  mesh.position.set(b.x, b.h/2, b.z);
  mesh.userData.type = 'building';
  scene.add(mesh);
  buildingMeshes.push(mesh);
  buildingAABB.push({minX:b.x-b.w/2, maxX:b.x+b.w/2, minZ:b.z-b.d/2, maxZ:b.z+b.d/2, top:b.h});
});

/* ============================================================
   Climbable structures (towers & jump crates) - solid, steppable
   ============================================================ */
const climbDefs = [
  {x:-18,   z:0, w:1.6, d:1.6, top:0.9},
  {x:-19.6, z:0, w:1.6, d:1.6, top:1.8},
  {x:-21.4, z:0, w:3.0, d:3.0, top:2.7},

  {x: 18,   z:0, w:1.6, d:1.6, top:0.9},
  {x: 19.6, z:0, w:1.6, d:1.6, top:1.8},
  {x: 21.4, z:0, w:3.0, d:3.0, top:2.7},

  {x:-4, z: 4, w:1.3, d:1.3, top:1.0},
  {x: 4, z: 4, w:1.3, d:1.3, top:1.0},
  {x:-4, z:-4, w:1.3, d:1.3, top:1.0},
  {x: 4, z:-4, w:1.3, d:1.3, top:1.0}
];
const climbAABB = [];
const climbMeshes = [];
climbDefs.forEach(c=>{
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(c.w, c.top, c.d), new THREE.MeshLambertMaterial({color:0x7a5a35}));
  mesh.position.set(c.x, c.top/2, c.z);
  mesh.userData.type = 'climb';
  scene.add(mesh);
  climbMeshes.push(mesh);
  climbAABB.push({minX:c.x-c.w/2, maxX:c.x+c.w/2, minZ:c.z-c.d/2, maxZ:c.z+c.d/2, top:c.top});
});

const allSolidAABB = buildingAABB.concat(climbAABB);
const allSolidMeshes = buildingMeshes.concat(climbMeshes);

/* ============================================================
   Ammo crates (mirrored pairs for fairness)
   ============================================================ */
const crateDefs = [{x:-5,z:14},{x:5,z:14},{x:-5,z:-14},{x:5,z:-14}];
const crates = crateDefs.map(c=>{
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.55,0.55), new THREE.MeshLambertMaterial({color:0xd9b23c, emissive:0x554000}));
  mesh.position.set(c.x, 0.3, c.z);
  scene.add(mesh);
  return {mesh, x:c.x, z:c.z, active:true, cooldown:0};
});

/* ============================================================
   Player state
   ============================================================ */
const player = { pos:new THREE.Vector3(0,0,30), yaw:0, pitch:0, health:100, radius:0.4, eyeHeight:1.65, velY:0, grounded:true };
const GRAVITY = -24;
const JUMP_SPEED = 7.2;

let mag=5, magSize=5, reserve=40, reserveMax=80;
let reloading=false, isAiming=false;
let score=0, kills=0, wave=1;
let mode='ai';           // 'ai' | 'pvp'
let gameState='menu';    // menu | playing | dead | victory | paused | waitingForOpponentReady | disconnected
let pointerLocked=false;
let matchEndedLocally=false;
let prePauseState='playing';

camera.rotation.order='YXZ';
camera.position.set(player.pos.x, player.eyeHeight, player.pos.z);
camera.rotation.y=player.yaw;

const gunGroup = new THREE.Group();
const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.09,0.6), new THREE.MeshLambertMaterial({color:0x22221f}));
gunBody.position.set(0.22,-0.22,-0.55);
const gunScopeMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.18,8), new THREE.MeshLambertMaterial({color:0x111111}));
gunScopeMesh.rotation.x = Math.PI/2;
gunScopeMesh.position.set(0.22,-0.13,-0.7);
gunGroup.add(gunBody, gunScopeMesh);
camera.add(gunGroup);
scene.add(camera);

/* ============================================================
   AI enemies (practice mode)
   ============================================================ */
const nests = [
  {hidden:{x:-14,z:-6},  peek:{x:-11,z:-6}},
  {hidden:{x: 14,z:-6},  peek:{x: 11,z:-6}},
  {hidden:{x:-9, z:-16}, peek:{x:-9, z:-12}},
  {hidden:{x: 9, z:-16}, peek:{x: 9, z:-12}},
  {hidden:{x:-24,z:-11}, peek:{x:-21,z:-11}},
  {hidden:{x: 24,z:-11}, peek:{x: 21,z:-11}}
];
let enemies = [];
let enemyIdSeq = 0;

function makeEnemy(nest){
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6,1.15,0.4), new THREE.MeshLambertMaterial({color:0x5b6b3f}));
  body.position.y = 0.87;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3,12,10), new THREE.MeshLambertMaterial({color:0xd8b48c}));
  head.position.y = 1.72;
  const gun = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,0.7), new THREE.MeshLambertMaterial({color:0x1a1a1a}));
  gun.position.set(0.3,1.0,0.1);
  group.add(body, head, gun);
  group.position.set(nest.hidden.x, 0, nest.hidden.z);
  scene.add(group);
  const id = enemyIdSeq++;
  body.userData={type:'enemyBody', id};
  head.userData={type:'enemyHead', id};
  return {id, group, body, head, nest, hp:100, alive:true, state:'hidden', timer:1.0+Math.random()*1.5, firedThisPeek:false, fireDelay:0};
}

function spawnWave(n){
  enemies.forEach(e=>{ if(e.alive){ scene.remove(e.group); e.alive=false; } });
  enemies = [];
  const count = Math.min(2+(n-1), 5);
  for(let i=0;i<count;i++) enemies.push(makeEnemy(nests[i % nests.length]));
  updateEnemyLeftHUD();
}

/* ============================================================
   PvP opponent avatar (single remote-driven mesh)
   ============================================================ */
const opponent = (function(){
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6,1.15,0.4), new THREE.MeshLambertMaterial({color:0x3f5b8a}));
  body.position.y = 0.87;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3,12,10), new THREE.MeshLambertMaterial({color:0xd8b48c}));
  head.position.y = 1.72;
  group.add(body, head);
  group.visible = false;
  scene.add(group);
  body.userData = {type:'oppBody'};
  head.userData = {type:'oppHead'};
  return {group, body, head, targetPos:new THREE.Vector3(0,0,-30), renderYaw:Math.PI, targetYaw:Math.PI, knownHp:100, aliveRemote:true};
})();

function lerpAngle(a,b,t){
  let diff = ((b-a+Math.PI)%(2*Math.PI))-Math.PI;
  if(diff < -Math.PI) diff += 2*Math.PI;
  return a + diff*t;
}
function updateOpponentAvatar(dt){
  const alpha = Math.min(1, dt*12);
  opponent.group.position.x += (opponent.targetPos.x - opponent.group.position.x)*alpha;
  opponent.group.position.y += (opponent.targetPos.y - opponent.group.position.y)*alpha;
  opponent.group.position.z += (opponent.targetPos.z - opponent.group.position.z)*alpha;
  opponent.renderYaw = lerpAngle(opponent.renderYaw, opponent.targetYaw, alpha);
  opponent.group.rotation.y = opponent.renderYaw;
  opponent.group.visible = opponent.aliveRemote;
}

/* ============================================================
   1:1 AI bot (full player-equivalent: moves, jumps, climbs, aims, reloads)
   ============================================================ */
const botMagSize = 5;
const bot = (function(){
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6,1.15,0.4), new THREE.MeshLambertMaterial({color:0x8a3f3f}));
  body.position.y = 0.87;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3,12,10), new THREE.MeshLambertMaterial({color:0xd8b48c}));
  head.position.y = 1.72;
  group.add(body, head);
  group.visible = false;
  scene.add(group);
  body.userData = {type:'botBody'};
  head.userData = {type:'botHead'};
  return {
    group, body, head,
    pos:new THREE.Vector3(0,0,-30), velY:0, grounded:true,
    health:100, mag:botMagSize, reserve:200, reloading:false, reloadTimer:0,
    fireTimer:2, decisionTimer:1, state:'patrol',
    target:{x:0,z:-30,y:0}, climbChain:null, climbIndex:0,
    facingYaw:0, alive:true
  };
})();

const groundWaypoints = [
  {x:-14,z:-6,y:0},{x:14,z:-6,y:0},{x:-9,z:-16,y:0},{x:9,z:-16,y:0},{x:-24,z:-11,y:0},{x:24,z:-11,y:0},
  {x:-14,z: 6,y:0},{x:14,z: 6,y:0},{x:-9,z: 16,y:0},{x:9,z: 16,y:0},{x:-24,z: 11,y:0},{x:24,z: 11,y:0},
  {x:-4,z:4,y:1.0},{x:4,z:4,y:1.0},{x:-4,z:-4,y:1.0},{x:4,z:-4,y:1.0},
  {x:0,z:-2,y:0},{x:0,z:2,y:0}
];
const westChain = [{x:-18,z:3,y:0},{x:-18,z:0,y:0.9},{x:-19.6,z:0,y:1.8},{x:-21.4,z:0,y:2.7}];
const eastChain = [{x: 18,z:3,y:0},{x: 18,z:0,y:0.9},{x: 19.6,z:0,y:1.8},{x: 21.4,z:0,y:2.7}];

function chooseBotTarget(){
  if(Math.random() < 0.3){
    bot.climbChain = Math.random()<0.5 ? westChain : eastChain;
    bot.climbIndex = 0;
    bot.state = 'climbing';
    bot.decisionTimer = 99;
  } else {
    bot.target = groundWaypoints[Math.floor(Math.random()*groundWaypoints.length)];
    bot.state = 'patrol';
    bot.decisionTimer = 1.8 + Math.random()*2;
  }
}

function updateBotMovement(dt, target){
  const dx = target.x - bot.pos.x, dz = target.z - bot.pos.z;
  const dist = Math.sqrt(dx*dx + dz*dz);
  if(dist > 0.4){
    const spd = 4.4;
    const nx = bot.pos.x + (dx/dist)*spd*dt;
    const nz = bot.pos.z + (dz/dist)*spd*dt;
    if(!collides(nx, bot.pos.z, bot.pos.y)) bot.pos.x = nx;
    if(!collides(bot.pos.x, nz, bot.pos.y)) bot.pos.z = nz;
    bot.facingYaw = Math.atan2(-dx, -dz);
  }
  return dist;
}

function updateBot(dt){
  if(!bot.alive) return;
  bot.decisionTimer -= dt;

  if(bot.state === 'climbing'){
    const cp = bot.climbChain[bot.climbIndex];
    const hdist = updateBotMovement(dt, cp);
    if(bot.grounded && cp.y > bot.pos.y + 0.3 && hdist < 2.4){ bot.velY = JUMP_SPEED; bot.grounded = false; }
    if(hdist < 0.6 && Math.abs(bot.pos.y - cp.y) < 0.35){
      bot.climbIndex++;
      if(bot.climbIndex >= bot.climbChain.length){ bot.state = 'hold'; bot.decisionTimer = 5 + Math.random()*4; }
    }
  } else if(bot.state === 'hold'){
    if(bot.decisionTimer <= 0){ chooseBotTarget(); }
  } else {
    if(bot.decisionTimer <= 0 || !bot.target){ chooseBotTarget(); }
    const hdist = updateBotMovement(dt, bot.target);
    if(bot.grounded && bot.target.y > bot.pos.y + 0.3 && hdist < 2.4){ bot.velY = JUMP_SPEED; bot.grounded = false; }
  }

  resolveVerticalGeneric(bot, dt);
  bot.group.position.set(bot.pos.x, bot.pos.y, bot.pos.z);
  bot.group.rotation.y = bot.facingYaw;

  updateBotCombat(dt);
}

function updateBotCombat(dt){
  if(!bot.alive) return;
  const headPos = bot.head.getWorldPosition(new THREE.Vector3());
  const playerHead = camera.getWorldPosition(new THREE.Vector3());
  const dist = headPos.distanceTo(playerHead);
  const hasLOS = dist < 70 && !isBlockedByBuildings(headPos, playerHead);

  if(bot.reloading){
    bot.reloadTimer -= dt;
    if(bot.reloadTimer <= 0){ bot.mag = botMagSize; bot.reloading = false; }
    return;
  }

  if(hasLOS){
    const dx = playerHead.x - bot.pos.x, dz = playerHead.z - bot.pos.z;
    bot.group.rotation.y = Math.atan2(-dx, -dz);

    bot.fireTimer -= dt;
    if(bot.fireTimer <= 0){
      bot.fireTimer = 0.55 + Math.random()*0.5;
      if(bot.mag <= 0){
        bot.reloading = true; bot.reloadTimer = 1.0;
      } else {
        bot.mag--;
        spawnTracer(headPos, playerHead, 0xff3b3b);
        const roll = Math.random();
        if(roll < 0.24){ applyIncomingHit(true, 100); }
        else if(roll < 0.68){ applyIncomingHit(false, 32); }
      }
    }
  }
}

function botTakeDamage(dmg, headshot){
  if(!bot.alive) return;
  bot.health -= dmg;
  flashHitmarker();
  if(headshot) flashHeadshot();
  score += headshot ? 100 : 10;
  updateHUD();
  updateBotHUD();
  if(bot.health <= 0){ botDie(); }
}

function botDie(){
  if(!bot.alive) return;
  bot.alive = false;
  bot.group.visible = false;
  kills++;
  score += 50;
  updateHUD();
  updateBotHUD();
  if(!matchEndedLocally){
    matchEndedLocally = true;
    gameState = 'victory';
    document.exitPointerLock && document.exitPointerLock();
    showVsBotResult(true);
  }
}

function updateBotHUD(){
  el('oppHealthBarInner').style.width = Math.max(0, bot.health) + '%';
  el('oppHealthNum').textContent = Math.max(0, Math.round(bot.health));
}

/* ============================================================
   Raycasting helpers
   ============================================================ */
const raycaster = new THREE.Raycaster();
function getAITargets(){
  const arr = [ground];
  allSolidMeshes.forEach(m=>arr.push(m));
  enemies.forEach(e=>{ if(e.alive){ arr.push(e.head, e.body); } });
  return arr;
}
function isBlockedByBuildings(fromV, toV){
  const dir = new THREE.Vector3().subVectors(toV, fromV);
  const dist = dir.length();
  dir.normalize();
  raycaster.set(fromV, dir);
  raycaster.far = Math.max(0.01, dist - 0.3);
  return raycaster.intersectObjects(allSolidMeshes, false).length > 0;
}

/* ============================================================
   Tracers
   ============================================================ */
const activeTracers = [];
function spawnTracer(from, to, color){
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  const mat = new THREE.LineBasicMaterial({color: color||0xfff3c0, transparent:true, opacity:0.9});
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  activeTracers.push({line, life:0.09});
}
function updateTracers(dt){
  for(let i=activeTracers.length-1;i>=0;i--){
    const t = activeTracers[i];
    t.life -= dt;
    t.line.material.opacity = Math.max(0, t.life/0.09)*0.9;
    if(t.life<=0){ scene.remove(t.line); t.line.geometry.dispose(); t.line.material.dispose(); activeTracers.splice(i,1); }
  }
}

/* ============================================================
   Mobile touch controls (virtual joystick + drag-look + buttons)
   ============================================================ */
const joystick = {active:false, id:null, cx:0, cy:0, dx:0, dz:0};
const lookTouch = {active:false, id:null, lastX:0, lastY:0};

if(isMobile){
  const joyBase = el('joystickBase');
  const joyKnob = el('joystickKnob');
  const JOY_RADIUS = 45;

  joyBase.addEventListener('touchstart', e=>{
    e.preventDefault();
    const t = e.changedTouches[0];
    const rect = joyBase.getBoundingClientRect();
    joystick.active = true;
    joystick.id = t.identifier;
    joystick.cx = rect.left + rect.width/2;
    joystick.cy = rect.top + rect.height/2;
  }, {passive:false});

  document.addEventListener('touchmove', e=>{
    for(const t of e.changedTouches){
      if(joystick.active && t.identifier===joystick.id){
        e.preventDefault();
        let dx = t.clientX - joystick.cx, dy = t.clientY - joystick.cy;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist > JOY_RADIUS){ dx = dx/dist*JOY_RADIUS; dy = dy/dist*JOY_RADIUS; }
        joyKnob.style.transform = 'translate('+dx+'px,'+dy+'px)';
        const mag = Math.min(1, dist/JOY_RADIUS);
        const nx = dx/JOY_RADIUS, ny = dy/JOY_RADIUS;
        joystick.dx = Math.abs(nx)>0.12 ? nx*mag : 0;
        joystick.dz = Math.abs(ny)>0.12 ? ny*mag : 0;
      }
      if(lookTouch.active && t.identifier===lookTouch.id){
        if(gameState==='playing' || gameState==='waitingForOpponentReady'){
          const dx = t.clientX - lookTouch.lastX, dy = t.clientY - lookTouch.lastY;
          const sens = isAiming ? 0.0013 : 0.0028;
          player.yaw -= dx*sens;
          player.pitch -= dy*sens;
          const lim = Math.PI/2 - 0.02;
          player.pitch = Math.max(-lim, Math.min(lim, player.pitch));
        }
        lookTouch.lastX = t.clientX; lookTouch.lastY = t.clientY;
      }
    }
  }, {passive:false});

  function endTouch(e){
    for(const t of e.changedTouches){
      if(joystick.active && t.identifier===joystick.id){
        joystick.active=false; joystick.id=null; joystick.dx=0; joystick.dz=0;
        joyKnob.style.transform = 'translate(0px,0px)';
      }
      if(lookTouch.active && t.identifier===lookTouch.id){
        lookTouch.active=false; lookTouch.id=null;
      }
    }
  }
  document.addEventListener('touchend', endTouch);
  document.addEventListener('touchcancel', endTouch);

  el('lookZone').addEventListener('touchstart', e=>{
    if(gameState!=='playing' && gameState!=='waitingForOpponentReady') return;
    if(lookTouch.active) return;
    const t = e.changedTouches[0];
    lookTouch.active = true;
    lookTouch.id = t.identifier;
    lookTouch.lastX = t.clientX; lookTouch.lastY = t.clientY;
  }, {passive:true});

  el('btnFire').addEventListener('touchstart', e=>{
    e.preventDefault();
    if(gameState==='playing') shoot();
  }, {passive:false});

  el('btnJump').addEventListener('touchstart', e=>{
    e.preventDefault();
    if(gameState==='playing') tryJump();
  }, {passive:false});

  el('btnReload').addEventListener('touchstart', e=>{
    e.preventDefault();
    tryReload();
  }, {passive:false});

  el('btnAim').addEventListener('touchstart', e=>{
    e.preventDefault();
    setAiming(!isAiming);
    el('btnAim').classList.toggle('on', isAiming);
  }, {passive:false});

  el('btnPauseMobile').addEventListener('touchstart', e=>{
    e.preventDefault();
    if(gameState==='playing' || gameState==='waitingForOpponentReady'){
      prePauseState = gameState;
      gameState='paused';
      showPauseScreen();
    }
  }, {passive:false});
}

/* ============================================================
   Shooting
   ============================================================ */
function shoot(){
  if(gameState!=='playing') return;
  if(reloading || mag<=0) return;
  mag--; updateHUD();

  const muzzle = camera.getWorldPosition(new THREE.Vector3());
  raycaster.setFromCamera({x:0,y:0}, camera);
  raycaster.far = 200;

  let targets;
  if(mode==='pvp'){
    targets = [ground].concat(allSolidMeshes);
    if(opponent.aliveRemote) targets.push(opponent.head, opponent.body);
  } else if(mode==='vsbot'){
    targets = [ground].concat(allSolidMeshes);
    if(bot.alive) targets.push(bot.head, bot.body);
  } else {
    targets = getAITargets();
  }
  const hits = raycaster.intersectObjects(targets, false);

  let endPoint = muzzle.clone().add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(150));
  let tracerColor = 0xfff3c0;

  if(hits.length > 0){
    const hit = hits[0];
    endPoint = hit.point;
    const type = hit.object.userData.type;

    if(mode==='pvp'){
      if(type==='oppHead'){ sendMsg({t:'hit', headshot:true, dmg:100}); flashHitmarker(); flashHeadshot(); score+=100; tracerColor=0xff5544; }
      else if(type==='oppBody'){ sendMsg({t:'hit', headshot:false, dmg:40}); flashHitmarker(); score+=10; tracerColor=0xff5544; }
    } else if(mode==='vsbot'){
      if(type==='botHead'){ botTakeDamage(100,true); tracerColor=0xff5544; }
      else if(type==='botBody'){ botTakeDamage(40,false); tracerColor=0xff5544; }
    } else {
      if(type==='enemyHead'){
        const enemy = enemies.find(e=>e.id===hit.object.userData.id && e.alive);
        if(enemy){ killEnemy(enemy, true); tracerColor=0xff5544; }
      } else if(type==='enemyBody'){
        const enemy = enemies.find(e=>e.id===hit.object.userData.id && e.alive);
        if(enemy){ damageEnemy(enemy, 40); tracerColor=0xff5544; }
      }
    }
    updateHUD();
  }
  spawnTracer(muzzle, endPoint, tracerColor);
}

function damageEnemy(enemy, amount){
  enemy.hp -= amount;
  flashHitmarker();
  if(enemy.hp <= 0){ killEnemy(enemy, false); }
  else { score += 10; updateHUD(); }
}
function killEnemy(enemy, headshot){
  if(!enemy.alive) return;
  enemy.alive = false;
  scene.remove(enemy.group);
  kills++;
  score += headshot ? 100 : 50;
  flashHitmarker();
  if(headshot) flashHeadshot();
  updateHUD();
  updateEnemyLeftHUD();
  if(enemies.every(e=>!e.alive)){
    setTimeout(()=>{
      if(mode==='ai' && (gameState==='playing' || gameState==='paused')){
        wave++;
        reserve = Math.min(reserveMax, reserve + 15);
        spawnWave(wave);
        updateHUD();
      }
    }, 1800);
  }
}

function tryReload(){
  if(gameState!=='playing') return;
  if(reloading || mag===magSize || reserve<=0) return;
  reloading = true;
  el('reloadMsg').textContent = '재장전 중...';
  setTimeout(()=>{
    const need = magSize - mag;
    const take = Math.min(need, reserve);
    mag += take; reserve -= take;
    reloading = false;
    el('reloadMsg').textContent = '';
    updateHUD();
  }, 1300);
}

/* ============================================================
   AI behavior (practice mode)
   ============================================================ */
function enemyWorldHeadPos(enemy){ return enemy.head.getWorldPosition(new THREE.Vector3()); }
function updateEnemies(dt){
  const playerHead = camera.getWorldPosition(new THREE.Vector3());
  enemies.forEach(enemy=>{
    if(!enemy.alive) return;
    enemy.timer -= dt;
    if(enemy.state==='hidden'){
      if(enemy.timer<=0){
        enemy.state='peek'; enemy.timer=2.2; enemy.firedThisPeek=false;
        enemy.fireDelay = 1.0 + Math.random()*0.8;
        enemy.group.position.set(enemy.nest.peek.x, 0, enemy.nest.peek.z);
      }
    } else {
      if(!enemy.firedThisPeek && enemy.timer <= (2.2 - enemy.fireDelay)){
        enemy.firedThisPeek = true;
        attemptEnemyShot(enemy, playerHead);
      }
      if(enemy.timer<=0){
        enemy.state='hidden'; enemy.timer = 2.2 + Math.random()*2.2;
        enemy.group.position.set(enemy.nest.hidden.x, 0, enemy.nest.hidden.z);
      }
    }
  });
}
function attemptEnemyShot(enemy, playerHeadPos){
  const from = enemyWorldHeadPos(enemy);
  const dist = from.distanceTo(playerHeadPos);
  if(dist > 65) return;
  if(isBlockedByBuildings(from, playerHeadPos)) return;
  spawnTracer(from, playerHeadPos, 0xff3b3b);
  if(Math.random() < 0.16 && gameState==='playing'){
    const dmg = 6 + Math.random()*8;
    player.health -= dmg;
    flashDamage();
    if(player.health<=0){ player.health=0; onPlayerDeath(); }
    updateHUD();
  }
}

/* ============================================================
   Ammo crate pickups
   ============================================================ */
function updateCrates(dt){
  crates.forEach(c=>{
    if(c.active){
      const dx=c.x-player.pos.x, dz=c.z-player.pos.z;
      if(Math.sqrt(dx*dx+dz*dz) < 1.7){
        const before = reserve;
        reserve = Math.min(reserveMax, reserve+12);
        if(reserve>before){ showPickupMsg('탄약 획득 +'+(reserve-before)); updateHUD(); }
        c.active=false; c.mesh.visible=false; c.cooldown=15;
      }
    } else {
      c.cooldown -= dt;
      if(c.cooldown<=0){ c.active=true; c.mesh.visible=true; }
    }
  });
}

/* ============================================================
   Movement & collision
   ============================================================ */
function collides(x,z,y){
  for(const s of allSolidAABB){
    if(y < s.top - 0.12){
      if(x+player.radius>s.minX && x-player.radius<s.maxX && z+player.radius>s.minZ && z-player.radius<s.maxZ) return true;
    }
  }
  return false;
}
function updateMovement(dt){
  const speed = isAiming ? 1.6 : 4.2;
  let moveX=0, moveZ=0;
  if(keys['KeyW']) moveZ -= 1;
  if(keys['KeyS']) moveZ += 1;
  if(keys['KeyA']) moveX -= 1;
  if(keys['KeyD']) moveX += 1;
  if(isMobile){ moveX += joystick.dx; moveZ += joystick.dz; }
  if(moveX===0 && moveZ===0) return;
  const len = Math.sqrt(moveX*moveX+moveZ*moveZ);
  if(len > 1){ moveX/=len; moveZ/=len; }
  const sinY=Math.sin(player.yaw), cosY=Math.cos(player.yaw);
  const worldX = moveX*cosY + moveZ*sinY;
  const worldZ = -moveX*sinY + moveZ*cosY;
  const nx = player.pos.x + worldX*speed*dt;
  const nz = player.pos.z + worldZ*speed*dt;
  const bound = 40;
  if(!collides(nx, player.pos.z, player.pos.y) && Math.abs(nx)<bound) player.pos.x = nx;
  if(!collides(player.pos.x, nz, player.pos.y) && Math.abs(nz)<bound) player.pos.z = nz;
}

function tryJump(){
  if(player.grounded){ player.velY = JUMP_SPEED; player.grounded = false; }
}

function resolveVerticalGeneric(entity, dt){
  const prevY = entity.pos.y;
  entity.velY += GRAVITY*dt;
  const newY = prevY + entity.velY*dt;

  let supportTop = 0;
  let onSupport = (newY <= 0 && prevY >= -0.06);

  for(const s of allSolidAABB){
    if(entity.pos.x > s.minX && entity.pos.x < s.maxX && entity.pos.z > s.minZ && entity.pos.z < s.maxZ){
      if(prevY >= s.top - 0.06 && newY <= s.top){
        if(!onSupport || s.top > supportTop){ supportTop = s.top; onSupport = true; }
      }
    }
  }

  if(onSupport){
    entity.pos.y = supportTop;
    entity.velY = 0;
    entity.grounded = true;
  } else {
    entity.pos.y = newY;
    entity.grounded = false;
  }
}
function resolveVertical(dt){ resolveVerticalGeneric(player, dt); }

/* ============================================================
   WebRTC networking (code-based manual signaling, no server)
   ============================================================ */
const ICE_CONFIG = { iceServers: [
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'}
]};

let pc = null, dataChannel = null, isHost = false;
let localReady = false, remoteReady = false;
let stateIntervalId = null;

function encodeSDP(desc){
  const json = JSON.stringify({type:desc.type, sdp:desc.sdp});
  return btoa(unescape(encodeURIComponent(json)));
}
function decodeSDP(code){
  const json = decodeURIComponent(escape(atob(code.trim())));
  const obj = JSON.parse(json);
  return new RTCSessionDescription(obj);
}
function waitIceGatheringComplete(peer){
  return new Promise(resolve=>{
    if(peer.iceGatheringState==='complete'){ resolve(); return; }
    function check(){
      if(peer.iceGatheringState==='complete'){
        peer.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
    }
    peer.addEventListener('icegatheringstatechange', check);
    setTimeout(()=>{ peer.removeEventListener('icegatheringstatechange', check); resolve(); }, 5000);
  });
}

function setupPeerHandlers(peer){
  peer.addEventListener('connectionstatechange', ()=>{
    const st = peer.connectionState;
    if(st==='disconnected' || st==='failed' || st==='closed'){
      if(gameState==='playing' || gameState==='waitingForOpponentReady' || gameState==='paused'){
        onDisconnected();
      }
    }
  });
}

function setupDataChannel(dc){
  dc.onopen = ()=>{ showReadyScreen(); };
  dc.onmessage = (e)=>{
    try{ handleMsg(JSON.parse(e.data)); }catch(err){}
  };
  dc.onclose = ()=>{
    if(gameState==='playing' || gameState==='waitingForOpponentReady' || gameState==='paused'){
      onDisconnected();
    }
  };
}

function sendMsg(obj){
  if(dataChannel && dataChannel.readyState==='open'){
    try{ dataChannel.send(JSON.stringify(obj)); }catch(e){}
  }
}

async function hostCreateOffer(){
  pc = new RTCPeerConnection(ICE_CONFIG);
  setupPeerHandlers(pc);
  dataChannel = pc.createDataChannel('game', {ordered:true});
  setupDataChannel(dataChannel);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitIceGatheringComplete(pc);
  return encodeSDP(pc.localDescription);
}
async function hostAcceptAnswer(answerCode){
  const desc = decodeSDP(answerCode);
  await pc.setRemoteDescription(desc);
}
async function guestCreateAnswer(offerCode){
  pc = new RTCPeerConnection(ICE_CONFIG);
  setupPeerHandlers(pc);
  pc.addEventListener('datachannel', (e)=>{ dataChannel = e.channel; setupDataChannel(dataChannel); });
  const offerDesc = decodeSDP(offerCode);
  await pc.setRemoteDescription(offerDesc);
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await waitIceGatheringComplete(pc);
  return encodeSDP(pc.localDescription);
}

function handleMsg(msg){
  if(msg.t==='state'){
    opponent.targetPos.set(msg.x, msg.y||0, msg.z);
    opponent.targetYaw = msg.yaw;
    opponent.knownHp = Math.max(0, msg.hp);
    opponent.aliveRemote = msg.alive;
    updateOpponentHUD();
    if(msg.alive===false) handlePossibleVictory();
  } else if(msg.t==='hit'){
    applyIncomingHit(msg.headshot, msg.dmg);
  } else if(msg.t==='ready'){
    remoteReady = true;
    if(localReady && gameState==='waitingForOpponentReady') startMatchNow();
  }
}

function applyIncomingHit(headshot, dmg){
  if(gameState!=='playing') return;
  player.health -= dmg;
  flashDamage();
  if(headshot) flashHeadshot();
  if(player.health <= 0){ player.health = 0; onPlayerDeath(); }
  updateHUD();
}

function handlePossibleVictory(){
  if(mode==='pvp' && gameState==='playing' && !matchEndedLocally && player.health>0){
    matchEndedLocally = true;
    if(stateIntervalId) clearInterval(stateIntervalId);
    document.exitPointerLock && document.exitPointerLock();
    gameState='victory';
    showResultScreen(true);
  }
}

function onDisconnected(){
  gameState = 'disconnected';
  if(stateIntervalId) clearInterval(stateIntervalId);
  document.exitPointerLock && document.exitPointerLock();
  blocker.classList.remove('hidden');
  blocker.innerHTML =
    '<div class="card"><h1>연결 끊김</h1>'+
    '<div class="sub">상대방과의 연결이 끊어졌습니다</div>'+
    '<button class="btn" id="reloadBtn">메인 메뉴로</button></div>';
  el('reloadBtn').addEventListener('click', ()=>location.reload());
}

function sendState(){
  sendMsg({t:'state', x:player.pos.x, y:player.pos.y, z:player.pos.z, yaw:player.yaw, hp:player.health, alive:player.health>0});
}

/* ============================================================
   Match / round control
   ============================================================ */
function startMatchNow(){
  localReady=false; remoteReady=false; matchEndedLocally=false;
  player.health=100; mag=magSize; reserve=40; reloading=false; isAiming=false;
  el('scope').classList.remove('active'); el('crosshair').classList.remove('hidden');
  player.pos.set(0,0, isHost?30:-30);
  player.yaw = isHost?0:Math.PI; player.pitch=0;
  player.velY=0; player.grounded=true;
  crates.forEach(c=>{ c.active=true; c.mesh.visible=true; c.cooldown=0; });

  const oppSpawnZ = isHost? -30:30;
  const oppSpawnYaw = isHost? Math.PI:0;
  opponent.targetPos.set(0,0,oppSpawnZ); opponent.targetYaw=oppSpawnYaw; opponent.renderYaw=oppSpawnYaw;
  opponent.group.position.set(0,0,oppSpawnZ); opponent.group.rotation.y=oppSpawnYaw;
  opponent.group.visible=true; opponent.aliveRemote=true; opponent.knownHp=100;

  el('oppHealthLabel').textContent = '상대 체력 (추정)';
  el('waitMsg').style.display='none';
  blocker.classList.add('hidden');
  gameState='playing';
  updateHUD(); updateOpponentHUD();

  if(stateIntervalId) clearInterval(stateIntervalId);
  stateIntervalId = setInterval(sendState, 100);
}

function onPlayerDeath(){
  if(matchEndedLocally) return;
  matchEndedLocally = true;
  if(mode==='pvp' && stateIntervalId) clearInterval(stateIntervalId);
  gameState='dead';
  document.exitPointerLock && document.exitPointerLock();
  if(mode==='pvp'){ showResultScreen(false); }
  else if(mode==='vsbot'){ showVsBotResult(false); }
  else { showAIDeathScreen(); }
}

function onReadyClick(){
  localReady = true;
  sendMsg({t:'ready'});
  requestLock();
  if(remoteReady){ startMatchNow(); }
  else { gameState='waitingForOpponentReady'; el('waitMsg').style.display='block'; }
}

function startVsBotMatch(){

  player.velY=0; player.grounded=true;

  el('scope').classList.remove('active'); el('crosshair').classList.remove('hidden');
  score=0; kills=0;
  crates.forEach(c=>{ c.active=true; c.mesh.visible=true; c.cooldown=0; });

  bot.health=100; bot.mag=botMagSize; bot.reserve=200; bot.reloading=false;

function showAIDeathScreen(){

    '<div class="sub">적 저격수에게 당했습니다</div>'+

function resetAIGame(){
  mode='ai';
  player.health=100; player.pos.set(0,0,30); player.yaw=0; player.pitch=0;
  player.velY=0; player.grounded=true;
  mag=magSize; reserve=40; reloading=false; isAiming=false;
  score=0; kills=0; wave=1; matchEndedLocally=false;
  crates.forEach(c=>{ c.active=true; c.mesh.visible=true; c.cooldown=0; });
  el('oppHealthBox').style.display='none';
  el('waveBox').style.display='block';

    '<div class="card menuStack">'+

        (isMobile ?

        )+

      '<button class="btn secondary" id="hostBtn">방 만들기 (호스트)</button>'+

  el('aiBtn').addEventListener('click', ()=>{ mode='ai'; resetAIGame(); requestLock(); });
  el('vsbotBtn').addEventListener('click', startVsBotMatch);

  el('joinBtn').addEventListener('click', ()=>{ mode='pvp'; isHost=false; showGuestSetupScreen(); });

function showHostSetupScreen(){
  el('oppHealthBox').style.display='block';
  el('waveBox').style.display='none';
  blocker.innerHTML =
    '<div class="card"><h1>방 만들기</h1><div class="sub">코드를 생성하는 중입니다...</div></div>';
  hostCreateOffer().then(code=>{
    blocker.innerHTML =
      '<div class="card">'+
        '<h1>방 만들기</h1>'+
        '<div class="fieldLabel">① 아래 코드를 복사해서 친구에게 보내세요</div>'+
        '<textarea class="codeArea" id="hostCode" readonly></textarea>'+
        '<button class="btn small secondary" id="copyHostCode">코드 복사</button>'+
        '<div class="fieldLabel">② 친구가 보내준 응답 코드를 여기 붙여넣으세요</div>'+
        '<textarea class="codeArea" id="answerInput" placeholder="친구의 응답 코드 붙여넣기"></textarea>'+
        '<button class="btn" id="connectBtn">연결하기</button>'+
        '<div class="statusMsg" id="hostStatus"></div>'+
        '<span class="backLink" id="backLink1">메인 메뉴로</span>'+
      '</div>';
    el('hostCode').value = code;
    el('copyHostCode').addEventListener('click', ()=>{
      const ta = el('hostCode'); ta.select(); ta.setSelectionRange(0,999999);
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(()=>{
          el('copyHostCode').textContent='복사됨!';
          setTimeout(()=>{ el('copyHostCode').textContent='코드 복사'; },1200);
        }).catch(()=>{});
      }
    });
    el('connectBtn').addEventListener('click', async ()=>{
      const val = el('answerInput').value.trim();
      if(!val){ el('hostStatus').textContent='응답 코드를 먼저 붙여넣으세요.'; el('hostStatus').className='statusMsg err'; return; }
      el('hostStatus').textContent='연결 시도 중...'; el('hostStatus').className='statusMsg';
      try{
        await hostAcceptAnswer(val);
        el('hostStatus').textContent='연결 대기 중... (상대방 데이터 채널 오픈을 기다립니다)';
      }catch(err){
        el('hostStatus').textContent='코드가 올바르지 않습니다. 다시 확인해주세요.';
        el('hostStatus').className='statusMsg err';
      }
    });
    el('backLink1').addEventListener('click', ()=>location.reload());
  }).catch(()=>{
    blocker.innerHTML = '<div class="card"><h1>오류</h1><div class="sub">코드 생성에 실패했습니다. 브라우저가 WebRTC를 지원하는지 확인해주세요.</div>'+
      '<span class="backLink" id="backLinkErr">메인 메뉴로</span></div>';
    el('backLinkErr').addEventListener('click', ()=>location.reload());
  });
}

function showGuestSetupScreen(){
  el('oppHealthBox').style.display='block';
  el('waveBox').style.display='none';
  blocker.innerHTML =
    '<div class="card">'+
      '<h1>코드로 참가</h1>'+
      '<div class="fieldLabel">① 호스트가 보내준 코드를 붙여넣으세요</div>'+
      '<textarea class="codeArea" id="offerInput" placeholder="호스트의 코드 붙여넣기"></textarea>'+

          '<span class="backLink" id="backLink3">메인 메뉴로</span>'+
        '</div>';
      el('guestCode').value = code;
      el('copyGuestCode').addEventListener('click', ()=>{

        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(code).then(()=>{
            el('copyGuestCode').textContent='복사됨!';
            setTimeout(()=>{ el('copyGuestCode').textContent='코드 복사'; },1200);
          }).catch(()=>{});
        }
      });
      el('backLink3').addEventListener('click', ()=>location.reload());
    }catch(err){

      el('guestStatus').className='statusMsg err';
    }
  });
  el('backLink2').addEventListener('click', ()=>location.reload());
}

/* ============================================================
   Main loop
   ============================================================ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(gameState==='playing'){
    updateMovement(dt);
    resolveVertical(dt);
    if(mode==='ai'){ updateEnemies(dt); }
    else if(mode==='pvp'){ updateOpponentAvatar(dt); }
    else if(mode==='vsbot'){ updateBot(dt); }
    updateCrates(dt);
  } else if(gameState==='waitingForOpponentReady' && mode==='pvp'){
    updateOpponentAvatar(dt);
  }
  updateTracers(dt);

  camera.position.set(player.pos.x, player.pos.y + player.eyeHeight, player.pos.z);
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  const targetFov = isAiming ? SCOPE_FOV : BASE_FOV;
  if(Math.abs(camera.fov - targetFov) > 0.1){
    camera.fov += (targetFov - camera.fov) * 0.25;
    camera.updateProjectionMatrix();
  }
  gunGroup.visible = !isAiming;

  renderer.render(scene, camera);
}

updateHUD();
showMainMenu();
animate();

})();
